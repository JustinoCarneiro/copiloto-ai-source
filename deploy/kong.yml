_format_version: "3.0"

# Roteamento do gateway Supabase self-hosted. Baseado no template oficial da Supabase,
# trimado (sem Storage/Realtime, que este projeto não usa — ver
# memoria-tecnica/decisoes/self-host-supabase-vps.md).

services:
  - name: auth-v1
    url: http://auth:9999/
    routes:
      - name: auth-v1-route
        strip_path: true
        paths:
          - /auth/v1/
    plugins:
      - name: cors

  - name: rest-v1
    url: http://rest:3000/
    routes:
      - name: rest-v1-route
        strip_path: true
        paths:
          - /rest/v1/
    plugins:
      - name: cors

  - name: functions-v1
    url: http://functions:9000/
    routes:
      - name: functions-v1-route
        strip_path: true
        paths:
          - /functions/v1/
    plugins:
      - name: cors

  # Studio (painel admin) — atrás de basic auth, só pra quem tem DASHBOARD_USERNAME/PASSWORD.
  - name: studio-v1
    url: http://studio:3000/
    routes:
      - name: studio-v1-route
        strip_path: true
        paths:
          - /
    plugins:
      - name: basic-auth
      - name: cors

consumers:
  - username: dashboard
    basicauth_credentials:
      - username: ${DASHBOARD_USERNAME}
        password: ${DASHBOARD_PASSWORD}
