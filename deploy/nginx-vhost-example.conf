# Vhosts do Copiloto AI — mesmo padrão já usado nesta VPS pra Sistema Melvin/Lucas
# (/etc/nginx/sites-available/institutomelvin.org): nginx do sistema + certbot, sem proxy em
# Docker. Copiar este arquivo (ajustando os domínios) pra
# /etc/nginx/sites-available/copiloto-ai, symlink em sites-enabled/, depois rodar certbot —
# passo a passo completo no RUNBOOK.md.
#
# Portas 8091 (frontend) e 8092 (kong/API) confirmadas livres nesta VPS em 2026-08-04 — ver
# memoria-tecnica/decisoes/self-host-supabase-vps.md antes de mudar, pra não colidir com
# Coolify (8000/8090/6001-6002), Melvin (3000/8443) ou Lucas (8081/8082/5432).

server {
    listen 80;
    server_name app.seudominio.com.br;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name app.seudominio.com.br;

    ssl_certificate /etc/letsencrypt/live/app.seudominio.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/app.seudominio.com.br/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location / {
        proxy_pass http://127.0.0.1:8091;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    listen 80;
    server_name api.seudominio.com.br;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name api.seudominio.com.br;

    ssl_certificate /etc/letsencrypt/live/api.seudominio.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.seudominio.com.br/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location / {
        proxy_pass http://127.0.0.1:8092;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Kong roteia por path (/auth/v1/, /rest/v1/, /functions/v1/) — o nginx só repassa,
        # sem reescrever nada. Mercado Pago manda o webhook pra
        # api.seudominio.com.br/functions/v1/mercadopago-webhook?token=... — isso já cai aqui.
    }
}
